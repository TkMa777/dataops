name: raw_sales_checkpoint
config_version: 1.0
template_name:
module_name: great_expectations.checkpoint
class_name: Checkpoint
run_name_template: "%Y%m%d-%H%M%S-raw-sales-validation"

expectation_suite_name: raw_sales_suite

validations:
  - batch_request:
      datasource_name: postgres_datasource
      data_connector_name: default_runtime_data_connector
      data_asset_name: raw_sales
      runtime_parameters:
        query: "SELECT * FROM raw_sales"
      batch_identifiers:
        default_identifier_name: default_identifier
    expectation_suite_name: raw_sales_suite

action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
      module_name: great_expectations.checkpoint.actions
  - name: store_evaluation_params
    action:
      class_name: StoreEvaluationParametersAction
      module_name: great_expectations.checkpoint.actions
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
      module_name: great_expectations.checkpoint.actions
      site_names: [local_site]

evaluation_parameters: {}
runtime_configuration: {}
ge_cloud_id: 