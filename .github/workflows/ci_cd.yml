name: DataOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Black
      run: |
        black --check dags/
    
    - name: Validate Airflow DAGs
      run: |
        python -c "from airflow.models import DagBag; dag_bag = DagBag('./dags', include_examples=False); print(f'DAG import errors: {dag_bag.import_errors}'); assert len(dag_bag.import_errors) == 0, 'DAG import errors found'"
    
    - name: Run Pytest
      run: |
        pytest -xvs

  dbt-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-postgres==1.5.2
    
    - name: Validate DBT project
      run: |
        cd dbt
        dbt --version
        dbt compile --profiles-dir profiles

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, dbt-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Create deployment artifacts
      run: |
        zip -r pipeline.zip dags/ dbt/ great_expectations/ data/ requirements.txt docker-compose.yml
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: pipeline-artifacts
        path: pipeline.zip
    
    - name: Deploy notification
      run: |
        echo "Pipeline ready for deployment to production" 