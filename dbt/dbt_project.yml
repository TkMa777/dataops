name: 'sales_pipeline'
version: '1.0.0'
config-version: 2

profile: 'sales_pipeline'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: ">=1.0.0"

packages:
  - package: dbt-labs/dbt_utils
    version: 1.0.0

models:
  sales_pipeline:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts 